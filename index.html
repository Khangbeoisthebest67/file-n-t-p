<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn thi trắc nghiệm</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--bd:#e0ded6;--ac:#2f6fed;--acx:#fff;--ok:#1f8a4c;--okb:#e3f5ea;--no:#c8372d;--nob:#fbe7e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161615;--card:#222220;--tx:#eeede8;--mut:#9b9a92;--bd:#38372f;--ac:#6b9bff;--acx:#10141f;--ok:#58c985;--okb:#183425;--no:#ff7b70;--nob:#3a1d1a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:10px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.s{padding:6px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:70px;resize:vertical}
.opt{display:flex;align-items:center;gap:8px;margin-top:8px}
.opt b{width:20px}
.opt input[type=radio]{width:20px;height:20px;accent-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.q{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.q p{margin:0}
.mut{color:var(--mut);font-size:14px}
.ch{display:block;width:100%;text-align:left;margin-top:8px;padding:12px}
.ch.ok{background:var(--okb);border-color:var(--ok)}
.ch.no{background:var(--nob);border-color:var(--no)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac)}
.expl{margin-top:10px;padding:10px;border-radius:8px;background:var(--bg);font-size:15px}
.big{font-size:44px;font-weight:700;text-align:center;margin:8px 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>📝 Ôn thi trắc nghiệm</h1>
<div class="tabs hide" id="tabs">
<button id="t1" class="on" onclick="tab(1)">Soạn câu hỏi</button>
<button id="t2" onclick="tab(2)">Làm bài</button>
</div>

<section id="v1">
<div class="card">
<label>Bài / chủ đề</label>
<input type="text" id="bi" placeholder="Ví dụ: Bài 1">
<label>Câu hỏi</label>
<textarea id="qt" placeholder="Nhập câu hỏi..."></textarea>
<label>Các đáp án (chọn nút tròn ở đáp án đúng)</label>
<div id="opts"></div>
<label>Giải thích (không bắt buộc)</label>
<input type="text" id="ex" placeholder="Vì sao đáp án này đúng?">
<div class="row"><button class="p" id="sv" onclick="save()">Thêm câu hỏi</button><button onclick="clearForm()">Xóa form</button></div>
<div id="err" class="mut" style="color:var(--no)"></div>
</div>
<div class="row" style="margin:0 0 12px">
<button class="s" onclick="exp()">⬇ Xuất file</button>
<button class="s" onclick="document.getElementById('imp').click()">⬆ Nhập file</button>
<button class="s" onclick="delAll()">🗑 Xóa hết</button>
<input type="file" id="imp" accept=".json" class="hide" onchange="imp(event)">
</div>
<p class="mut" id="cnt"></p>
<div id="list"></div>
<p class="mut">Để bạn thấy cùng bộ câu hỏi: bấm “Xuất file”, đổi tên file thành questions.json, thay vào repo rồi deploy lại.</p>
</section>

<section id="v2" class="hide"></section>
</main>
<script>
var KEY='quiz_questions_v1',Q=[],edit=-1,L=['A','B','C','D'];
function load(){try{Q=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){Q=[]}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(Q))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function buildOpts(){$('opts').innerHTML=L.map(function(l,i){return '<div class="opt"><input type="radio" name="c" value="'+i+'"'+(i==0?' checked':'')+'><b>'+l+'</b><input type="text" id="o'+i+'" placeholder="Đáp án '+l+'"></div>'}).join('')}
function clearForm(){edit=-1;$('qt').value='';$('ex').value='';$('err').textContent='';$('sv').textContent='Thêm câu hỏi';buildOpts()}
function save(){
var q=$('qt').value.trim(),o=L.map(function(_,i){return $('o'+i).value.trim()});
var c=+document.querySelector('input[name=c]:checked').value;
var n=o.filter(Boolean).length;
if(!q){$('err').textContent='Bạn chưa nhập câu hỏi.';return}
if(n<2){$('err').textContent='Cần ít nhất 2 đáp án.';return}
if(!o[c]){$('err').textContent='Đáp án đúng đang bị trống.';return}
var item={b:$('bi').value.trim(),q:q,o:o,c:c,e:$('ex').value.trim()};
if(edit>=0)Q[edit]=item;else Q.push(item);
store();clearForm();render()}
function render(){
$('cnt').textContent='Đã có '+Q.length+' câu hỏi';
$('list').innerHTML=Q.map(function(x,i){return '<div class="card"><div class="q"><p><b>'+(i+1)+'.</b> '+(x.b?'<span class="mut">['+esc(x.b)+']</span> ':'')+esc(x.q)+'<br><span class="mut">Đúng: '+L[x.c]+'. '+esc(x.o[x.c])+'</span></p><span class="row" style="margin:0"><button class="s" onclick="ed('+i+')">Sửa</button><button class="s" onclick="rm('+i+')">Xóa</button></span></div></div>'}).join('')}
function ed(i){var x=Q[i];edit=i;$('bi').value=x.b||'';$('qt').value=x.q;$('ex').value=x.e||'';buildOpts();x.o.forEach(function(v,k){$('o'+k).value=v});document.querySelector('input[name=c][value="'+x.c+'"]').checked=true;$('sv').textContent='Lưu thay đổi';window.scrollTo(0,0)}
function rm(i){Q.splice(i,1);store();clearForm();render()}
function delAll(){if(Q.length&&confirm('Xóa toàn bộ câu hỏi?')){Q=[];store();render()}}
function exp(){
var b=new Blob([JSON.stringify(Q,null,1)],{type:'application/json'}),a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='cau-hoi.json';a.click()}
function imp(ev){
var f=ev.target.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
Q=Q.concat(d.filter(function(x){return x&&x.q&&Array.isArray(x.o)}));store();render()}catch(e){alert('File không hợp lệ.')}};
r.readAsText(f);ev.target.value=''}
function tab(n){
$('v1').classList.toggle('hide',n!=1);$('v2').classList.toggle('hide',n!=2);
$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';
if(n==2)start()}
var S,SEL='';
function hdr(){
var bs=[],n={};
Q.forEach(function(q){if(q.b){if(!n[q.b]){n[q.b]=0;bs.push(q.b)}n[q.b]++}});
if(!bs.length)return '';
return '<div class="card"><label style="margin:0 0 4px">Chọn bài ôn</label><select onchange="SEL=this.value;start()" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit"><option value="">Tất cả các bài ('+Q.length+' câu)</option>'+bs.map(function(b){return '<option value="'+esc(b)+'"'+(b==SEL?' selected':'')+'>'+esc(b)+' ('+n[b]+' câu)</option>'}).join('')+'</select></div>'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){
if(!Q.length){$('v2').innerHTML='<div class="card">Chưa có câu hỏi nào. Hãy soạn ở tab “Soạn câu hỏi” trước nhé.</div>';return}
var idx=[];Q.forEach(function(q,i){if(!SEL||q.b===SEL)idx.push(i)});
if(!idx.length){SEL='';idx=Q.map(function(_,i){return i})}
S={list:shuffle(idx),i:0,score:0,done:false,wrong:[]};show()}
function show(){
var v=$('v2');
if(S.i>=S.list.length){
v.innerHTML=hdr()+'<div class="card"><div class="mut" style="text-align:center">Kết quả</div><div class="big">'+S.score+'/'+S.list.length+'</div><p style="text-align:center">'+(S.score==S.list.length?'Tuyệt vời! 🎉':S.score>=S.list.length/2?'Khá tốt, cố thêm chút nữa!':'Ôn thêm rồi làm lại nhé 💪')+'</p><div class="row" style="justify-content:center"><button class="p" onclick="start()">Làm lại</button>'+(S.wrong.length?'<button onclick="redo()">Làm lại câu sai ('+S.wrong.length+')</button>':'')+'</div></div>';return}
var x=Q[S.list[S.i]];S.done=false;
var ord=[];x.o.forEach(function(t,k){if(t)ord.push(k)});ord=shuffle(ord);
v.innerHTML=hdr()+'<div class="bar"><i style="width:'+(S.i/S.list.length*100)+'%"></i></div><div class="card"><p class="mut">Câu '+(S.i+1)+' / '+S.list.length+'</p><p><b>'+esc(x.q)+'</b></p>'+
ord.map(function(k){return '<button class="ch" onclick="pick(this,'+k+')">'+esc(x.o[k])+'</button>'}).join('')+'<div id="fb"></div></div>'}
function pick(btn,k){
if(S.done)return;S.done=true;
var idx=S.list[S.i],x=Q[idx],ok=k==x.c;
if(ok)S.score++;else S.wrong.push(idx);
var bs=document.querySelectorAll('.ch');
bs.forEach(function(b){if(b.textContent==x.o[x.c])b.classList.add('ok')});
if(!ok)btn.classList.add('no');
$('fb').innerHTML=(x.e?'<div class="expl">💡 '+esc(x.e)+'</div>':'')+'<div class="row"><button class="p" onclick="S.i++;show()">'+(S.i+1>=S.list.length?'Xem kết quả':'Câu tiếp')+'</button></div>'}
function redo(){S={list:shuffle(S.wrong),i:0,score:0,done:false,wrong:[]};show()}
load();buildOpts();render();
if(!Q.length){fetch('questions.json').then(function(r){return r.ok?r.json():[]}).then(function(d){if(Array.isArray(d)&&d.length){Q=d;render();if(!$('v2').classList.contains('hide'))start()}}).catch(function(){})}

var SECRET='#soan-ly10';
if(location.hash===SECRET){$('tabs').classList.remove('hide')}else{tab(2)}
window.addEventListener('hashchange',function(){location.reload()});
</script>
</body>
</html>
